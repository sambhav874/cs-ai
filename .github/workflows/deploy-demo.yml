# Push to dev → the demo VM rebuilds and restarts the stack.
#
# No registry: the commit is copied to the VM over SSH and built there, so
# images never leave the server. Docker's layer cache on the VM keeps a
# code-only change to a couple of minutes; a dependency change rebuilds that
# image's install layer.
#
# The stack is deploy/vm/docker-compose.yml; one-time set-up of the VM and the
# secrets below is in deploy/vm/README.md.

name: Deploy demo

on:
  push:
    # The demo tracks dev, so main stays releasable while the demo moves fast.
    branches: [dev]
  workflow_dispatch:

concurrency:
  # One deploy at a time. A newer push waits rather than cancels: cancelling
  # mid-build can leave the VM between two half-applied versions.
  group: deploy-demo
  cancel-in-progress: false

env:
  APP_DIR: /opt/contractsense

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: a first-use keyscan here would trust whoever
          # answers on that IP.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host demo\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config

      - name: Copy this commit to the VM
        run: |
          # git archive ships exactly the committed tree — no .env, no
          # node_modules, nothing untracked — and needs no git credentials on
          # the VM. Unpacked beside the live copy, then swapped in, so a failed
          # upload never leaves a half-written source tree.
          # Only what the images need: ~11 MB instead of ~53 MB with vendor/.
          git archive --format=tar HEAD -- apps packages packs deploy \
              package.json pnpm-lock.yaml pnpm-workspace.yaml .dockerignore \
            | ssh demo "set -e; rm -rf $APP_DIR/src.new; mkdir -p $APP_DIR/src.new; tar -x -C $APP_DIR/src.new"
          ssh demo "set -e; cd $APP_DIR; rm -rf src.old; [ -d src ] && mv src src.old; mv src.new src"

      - name: Build and restart
        run: |
          ssh demo "set -e
            cd $APP_DIR/src
            export GIT_COMMIT_SHA=${{ github.sha }}
            docker compose -p contractsense --env-file $APP_DIR/.env \
              -f deploy/vm/docker-compose.yml up -d --build --remove-orphans
            # Old image layers pile up with every build; keep the disk in check.
            docker image prune -f >/dev/null"

      - name: Wait for the demo to answer
        env:
          DEMO_URL: ${{ secrets.DEMO_URL }}
        run: |
          # Polls the API's readiness probe through Caddy, so a green tick means
          # the public URL works, not just the containers.
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              "${DEMO_URL%/}/api/health/ready" || echo 000)
            if [ "$code" = "200" ]; then echo "Demo healthy after ${i} checks."; exit 0; fi
            echo "  waiting (${i}/60, last ${code})"
            sleep 10
          done
          echo "Demo did not become healthy within 10 minutes. Recent logs:"
          ssh demo "cd $APP_DIR/src && docker compose -p contractsense -f deploy/vm/docker-compose.yml --env-file $APP_DIR/.env logs --tail 40 api intelligence migrate" || true
          exit 1
