# The Phase 1.1 agent eval gate.
#
# Two jobs, because they answer different questions and have different costs:
#
#   gate-harness  — runs on every PR. No provider key, no network. Verifies the
#                   metric computation, the regression comparator, and the whole
#                   agent path against a scripted model. This is what stops the
#                   gate from quietly measuring nothing.
#
#   agent-eval    — runs the real model against the fixture suite and diffs the
#                   seven metrics against the base branch, failing on a
#                   citation-support regression. Needs a provider key, so it is
#                   opt-in per PR (label `run-agent-eval`) plus nightly.
#
# Nothing in Phase 1 deletes loop behavior until agent-eval is green on a branch.

name: 'Agent Eval'

on:
  pull_request:
    paths:
      - 'apps/backend/services/contract_agent/**'
      - 'apps/backend/services/agent_memory.py'
      - 'apps/backend/services/project_memory.py'
      - 'apps/backend/api/routes/agent.py'
      - 'testing/backend/evals/**'
      - 'testing/backend/tests/test_agent_eval*.py'
      - '.github/workflows/agent-eval.yml'
  schedule:
    # 03:00 UTC daily, so a regression that only the real model exposes is
    # caught within a day rather than at release.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-harness:
    name: 'Gate harness (no provider key)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction --no-root

      - name: Validate the eval fixture suite
        working-directory: testing/backend
        run: |
          PYTHONPATH=../../apps/backend:. python -c "
          from pathlib import Path
          from evals.contractsense_agent.runners import load_suite
          suite = load_suite(Path('evals/contractsense_agent/fixtures/public_smoke.json'))
          multi = [c for c in suite.cases if c.follow_up_prompts]
          print(f'{suite.name} {suite.version}: {len(suite.cases)} cases, {len(multi)} multi-turn')
          assert multi, 'the suite must keep at least one multi-turn case'
          "

      - name: Agent gate — metrics, comparator, loop, citations, tool errors
        # One target so CI and a local run cannot drift apart.
        run: make eval-gate

  agent-eval:
    name: 'Agent eval vs base branch'
    runs-on: ubuntu-latest
    # Costs real model calls, so gate it on an explicit label for PRs. Scheduled
    # and manual runs always execute.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-agent-eval')
    permissions:
      contents: read
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CONTRACTSENSE_AI_PROVIDER: ${{ vars.CONTRACTSENSE_EVAL_PROVIDER || 'groq' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch to produce the baseline the metrics diff against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction --no-root

      - name: Run the eval on the base branch to produce a baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          mkdir -p reports
          # The base branch may predate the agent runner. A baseline we cannot
          # produce is not a failure — compare_metrics falls back to the
          # absolute citation-support floor and says so in the report.
          cd ../base/apps/backend && \
            PYTHONPATH=../..:../../testing/backend poetry run python \
              ../../testing/backend/scripts/evaluate_contractsense_agent.py \
              --runner agent --suite smoke \
              --output "$GITHUB_WORKSPACE/reports/baseline.json" \
            || echo "Baseline run failed; gating on the absolute floor only."

      - name: Run the eval on this branch and diff the metrics
        working-directory: apps/backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          BASELINE_ARG=""
          if [ -f "$GITHUB_WORKSPACE/reports/baseline.json" ]; then
            BASELINE_ARG="--baseline $GITHUB_WORKSPACE/reports/baseline.json"
          fi
          PYTHONPATH=../..:../../testing/backend poetry run python \
            ../../testing/backend/scripts/evaluate_contractsense_agent.py \
            --runner agent --suite smoke \
            --output "$GITHUB_WORKSPACE/reports/current.json" \
            --markdown-output "$GITHUB_WORKSPACE/reports/comparison.md" \
            $BASELINE_ARG \
            --fail-on-regression

      - name: Post the metric comparison on the PR
        # Runs even on failure: a regression is exactly when the table matters.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/reports/comparison.md`;
            if (!fs.existsSync(path)) {
              core.info('No comparison report produced; nothing to post.');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync(path, 'utf8'),
            });

      - name: Upload the eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-reports
          path: reports/
          retention-days: 30
