# The SPA and both APIs are served from one origin, which is what the app
# assumes: apps/web/src/lib/api.ts calls /api, and the ported ContractSense
# screens call /intel/api/v1 (vite.config.ts `define`). In development Vite's
# proxy does this; in a deployment this file does.

# Pass Connection: upgrade only for websocket requests; a plain request must
# keep the connection header nginx would otherwise send.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # Look the upstreams up again every 10s instead of once at start. nginx
  # otherwise pins the IP `api` had when this container started; when api is
  # recreated (a deploy, an upgrade's rollback, a crash) it gets a new IP and
  # every /api request went to the old one — a 404 or a hang until web was
  # restarted too. The upstreams are variables so the resolver is consulted.
  # NGINX_LOCAL_RESOLVERS is filled from /etc/resolv.conf by the nginx image
  # (NGINX_ENTRYPOINT_LOCAL_RESOLVERS in the Dockerfile), so this works under
  # Compose and Kubernetes alike.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $api_upstream http://api:8080;
  set $intel_upstream http://intelligence:8000;

  root /usr/share/nginx/html;
  index index.html;

  # Behind the TLS-terminating proxy (Caddy in self-host, Coolify's on the VM).
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  client_max_body_size 100m;

  # Redirects stay relative. Made absolute, they would name this container's
  # port (8080), not the address the browser used.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # nginx's mime.types has no .mjs, so the pdf.js worker went out as
    # application/octet-stream, which browsers refuse for a module script: the
    # citation PDF viewer and the KPI page's viewer could not start pdf.js.
    # (A `types` block here replaces the inherited map, so .js is listed too.)
    types {
      application/javascript js mjs;
      text/css css;
      image/svg+xml svg;
      image/png png;
      image/jpeg jpg jpeg;
      image/webp webp;
      font/woff2 woff2;
      font/woff woff;
      application/wasm wasm;
      application/json json;
    }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  # index.html must not be cached, or a deploy leaves browsers on the old
  # bundle whose hashed chunks have already been replaced.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Service-to-service routes. They are secret-guarded, but they return
  # plaintext provider keys and write records on behalf of any org, so they
  # are not reachable from outside the container network at all.
  location ^~ /api/internal/ {
    return 404;
  }
  location ^~ /intel/internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-common.conf;
  }

  # Hocuspocus co-editing (websocket).
  location /collab {
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-common.conf;
  }

  # Both services mount their routes under /api/v1, so the intelligence tier
  # lives at /intel and the prefix is stripped on the way through.
  location /intel/ {
    # A variable proxy_pass forwards the URI untouched, so strip /intel here.
    rewrite ^/intel/(.*)$ /$1 break;
    proxy_pass $intel_upstream;
    # FastAPI's trailing-slash redirect is absolute and knows nothing of the
    # /intel prefix; send the browser back through it.
    proxy_redirect ~^https?://[^/]+/(.*)$ /intel/$1;
    include /etc/nginx/proxy-common.conf;
    # Analysis of a long contract can outlast the default 60s.
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
