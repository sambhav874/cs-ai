<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New {{ feedback_type }} Report</title>
    <style>
        /* Basic styles for email client compatibility */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 8px;
        }
        h1 {
            font-size: 24px;
            color: #0056b3;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 10px;
        }
        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .details-table td {
            padding: 8px;
            border-bottom: 1px solid #eeeeee;
        }
        .details-table td:first-child {
            font-weight: bold;
            width: 100px;
            color: #555;
        }
        .message-box {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            white-space: pre-wrap; /* Preserves line breaks and spacing */
            font-family: "Courier New", Courier, monospace;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888888;
            text-align: center;
        }
        .footer a {
            color: #0056b3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New {{ feedback_type }} Report</h1>
        
        <p>A new submission has been received. You can reply directly to this email to contact the user.</p>

        <table class="details-table">
            <tr>
                <td>Type:</td>
                <td>{{ feedback_type }}</td>
            </tr>
            <tr>
                <td>From:</td>
                <td>{{ name }}</td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><a href="mailto:{{ user_email }}">{{ user_email }}</a></td>
            </tr>
        </table>
        
        <h2>User's Message:</h2>
        <div class="message-box">
            {{ message }}
        </div>
        
        <div class="footer">
            <p>This is an automated notification from your feedback service.</p>
        </div>
    </div>
</body>
</html>
