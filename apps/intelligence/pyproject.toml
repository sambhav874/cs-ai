pydantic = "^2.13.4"
transformers = "==4.48.1"
sentencepiece = "==0.2.0"
pydantic-settings = "^2.14.1"
pymongo = "^4.17.0"
chardet = "==5.2.0"
fastapi-users = "==14.0.1"
python-jose = "==3.3.0"
passlib = "==1.7.4"
httpx = "==0.28.1"
psutil = "^7.2.2"
aiofiles = "^24.1.0"
pymupdf = "^1.25.3"
gunicorn = "^23.0.0"
motor = "^3.7.0"
langchain-openai = "^1.2.2"
