[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["sambhav874 <sambhavjain874@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"  # was <=3.12, which Poetry reads as <=3.12.0 — excluding every real 3.12 release
fastapi = "^0.136.3"
