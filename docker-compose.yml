services:
  frontend:
    image: extractor-frontend
    build:
      context: ./apps/frontend
      target: production
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_EXTRACTOR_API_URL: ${NEXT_PUBLIC_EXTRACTOR_API_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend
    networks:
      - contractsense-net
    restart: unless-stopped

  backend:
    image: extractor-backend
    build:
      context: .
      dockerfile: apps/backend/Containerfile
      args:
        USE_GPU: "false"
    ports:
      - "8001:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:4200}
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
    networks:
      - contractsense-net
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  worker:
    image: extractor-worker
    build:
      context: .
      dockerfile: apps/backend/Containerfile.worker
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
    networks:
      - contractsense-net
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    profiles:
      - local-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - contractsense-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  shared:
  rabbitmq_data:

networks:
  contractsense-net:
    driver: bridge
