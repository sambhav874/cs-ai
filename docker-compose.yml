services:
  frontend:
    image: extractor-frontend
    build:
      context: ./apps/frontend
      target: production
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_EXTRACTOR_API_URL: ${NEXT_PUBLIC_EXTRACTOR_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200}
    ports:
      - "${FRONTEND_PORT:-4200}:3000"
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: unless-stopped

  backend:
    image: extractor-backend
    build:
      context: .
      dockerfile: apps/backend/Containerfile
      args:
        USE_GPU: ${USE_GPU:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    networks:
      - frontend-net
      - backend-net
    volumes:
      - ./shared:/app/shared
    depends_on:
      - rabbitmq
    restart: unless-stopped

  worker:
    image: extractor-worker
    build:
      context: .
      dockerfile: apps/backend/Containerfile.worker
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    networks:
      - backend-net
    volumes:
      - ./shared:/app/shared
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - backend-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  shared:
  rabbitmq_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
