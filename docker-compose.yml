services:
  frontend:
    image: extractor-frontend
    build:
      context: ./apps/frontend
      target: production
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_EXTRACTOR_API_URL: ${NEXT_PUBLIC_EXTRACTOR_API_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend
    networks:
      - contractsense-net
    restart: unless-stopped

  backend:
    image: extractor-backend
    build:
      context: .
      dockerfile: apps/backend/Containerfile
      args:
        USE_GPU: "false"
    ports:
      - "8001:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
    networks:
      - contractsense-net
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

  worker:
    image: extractor-worker
    build:
      context: .
      dockerfile: apps/backend/Containerfile.worker
    env_file:
      - ./apps/backend/.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
    networks:
      - contractsense-net
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

volumes:
  shared:

networks:
  contractsense-net:
    driver: bridge
