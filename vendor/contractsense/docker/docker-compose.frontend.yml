version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Containerfile
      target: production
    container_name: frontend-dev
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} 
    volumes:
      - ./apps/frontend:/app/apps/frontend
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge