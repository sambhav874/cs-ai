version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Containerfile
      target: development
    container_name: frontend-dev
    ports:
      - "4200:4200"
    env_file:
      - ./apps/frontend/.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - .:/app
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge