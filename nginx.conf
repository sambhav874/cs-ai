# Docker DNS resolver — dynamic re-resolution so nginx picks up container IP changes
resolver 127.0.0.11 valid=10s ipv6=off;

# ────────────────────────────────────────────────────────────
# HTTP — serves ACME challenges, redirects everything else to HTTPS
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN} localhost;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────────
# HTTPS — main server
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${DOMAIN} localhost;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip compression for API responses
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Timeouts tuned for long-running contract analysis requests
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Forward real client info
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health check endpoint — no proxy needed
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Frontend — proxy to Next.js
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API routes — load balanced across backend replicas
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # WebSocket — long-lived connections for job status
    location /ws {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ────────────────────────────────────────────────────────────
# Fallback — catch-all for unknown hostnames (dev/testing)
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 444;
}
