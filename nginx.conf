upstream backend {
    least_conn;
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Gzip compression for API responses
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Timeouts tuned for long-running contract analysis requests
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Forward real client info
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Health check endpoint — no proxy needed
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Frontend — proxy to Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API routes — load balanced across backend replicas
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # WebSocket — long-lived connections for job status
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
