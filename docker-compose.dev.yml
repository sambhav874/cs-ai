# The dev environment. Coolify deploys it from the dev branch: it clones the repo on
# the VM, builds the three images there, and starts everything. Images
# never leave the server, and deploys, logs and environment variables all live
# in the Coolify UI.
#
# It sits at the repo root so every build context is simply `.`, however
# Coolify resolves relative paths.
#
# Everything is one origin: `web` (nginx) serves the SPA and proxies /api to
# the lifecycle API and /intel to the intelligence tier. Only `web` is
# published, on a loopback port: the VM's host Caddy owns 80/443 (it also
# serves the old draftLegal demo) and proxies the public hostname to it.
#
# Set-up: deploy/vm/README.md.

x-build-api: &build-api
  context: .
  dockerfile: apps/api/Dockerfile

x-build-intelligence: &build-intelligence
  context: .
  dockerfile: apps/intelligence/Dockerfile

x-restart: &restart
  restart: unless-stopped

services:
  web:
    <<: *restart
    image: contractsense/web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # The VM's host Caddy owns 80/443 (it also serves the old draftLegal demo)
    # and reaches this stack on a loopback port; 8080 is draftLegal's.
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8090}:8080'
    depends_on:
      api:
        condition: service_started
      intelligence:
        condition: service_started

  # One-shot: MongoDB has no migration files, so the schema (indexes and
  # uniques included) is pushed on every deploy. Idempotent, and it must
  # finish before the API serves traffic.
  migrate:
    image: contractsense/api:latest
    # Built once by its sibling service; never pulled from a registry.
    pull_policy: never
    restart: 'no'
    entrypoint: ['sh', '-c']
    command:
      - >-
        DATABASE_URL="$$(node --import tsx src/lib/database-url.ts)"
        ./node_modules/.bin/prisma db push --schema prisma/schema.mongo.prisma --skip-generate
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0&directConnection=true}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mongo-migrate:
        condition: service_completed_successfully
        required: false

  # Creates the bucket the API writes documents to. MinIO does not create one
  # on first PUT, so without this every upload fails with NoSuchBucket. It
  # starts alongside MinIO, so it retries until MinIO accepts connections.
  minio-init:
    # MinIO no longer publishes images (Docker Hub and quay.io both gone; a
    # pull of the old digest now fails 401). pgsty builds the same upstream
    # release, same entrypoint and data format. Pinned to a release tag.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: 'no'
    entrypoint: ['sh', '-c']
    command:
      - >-
        i=0; until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1;
        do i=$$((i+1)); [ $$i -ge 60 ] && echo "MinIO did not come up" && exit 1; sleep 1; done &&
        mc mb --ignore-existing local/${S3_BUCKET:-clm-documents} &&
        mc anonymous set none local/${S3_BUCKET:-clm-documents}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in Coolify}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in Coolify}
    depends_on:
      minio:
        condition: service_started

  api:
    <<: *restart
    image: contractsense/api:latest
    build: *build-api
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      # The jobs service below runs the BullMQ workers and the cron scans; the
      # API must not consume the same queues (draftLegal's self-host compose
      # splits them the same way).
      WORKERS_ENABLED: 'false'
      GOTENBERG_URL: http://gotenberg:3000
      # Where contract files are linked for analysis (runbook step 6).
      INTELLIGENCE_URL: http://intelligence:8000
      # draftLegal's agent routes, now served by the intelligence tier.
      AGENTS_URL: http://intelligence:8000/agents
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0&directConnection=true}
      REDIS_URL: redis://redis:6379
      # Public origin, used in signer-portal links and emails. Without it those
      # links point nowhere.
      FRONTEND_URL: https://${APP_HOST:-${DEMO_HOST}}
      API_URL: https://${APP_HOST:-${DEMO_HOST}}
      WEB_BASE_URL: https://${APP_HOST:-${DEMO_HOST}}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      # Secrets. Generated once and kept in Coolify on the VM.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?set PORTAL_JWT_SECRET in Coolify}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in Coolify}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGEAI_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-clm-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in Coolify}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in Coolify}
      # Email: SendGrid (HTTPS) or SMTP. With neither set nothing is delivered;
      # Admin → Organization → Email shows the outbox either way.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      # The X.509 cert executed PDFs are sealed with (PAdES). Required in
      # production: without it every seal fails and a signed contract has no
      # sealed document. Generate: pnpm --filter api signing-cert
      SIGNING_CERT_P12_BASE64: ${SIGNING_CERT_P12_BASE64:-}
      SIGNING_CERT_PASSPHRASE: ${SIGNING_CERT_PASSPHRASE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # BullMQ workers, renewal and obligation scans. Same image as the API, run
  # through its worker entrypoint.
  jobs:
    <<: *restart
    image: contractsense/api:latest
    # Built once by its sibling service; never pulled from a registry.
    pull_policy: never
    command: ['node', '--import', 'tsx', 'src/worker-entrypoint.ts']
    # The image's health check probes the API's HTTP port; the jobs runner
    # serves no HTTP, so it would always read unhealthy.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      WORKERS_ENABLED: 'true'
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0&directConnection=true}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: https://${APP_HOST:-${DEMO_HOST}}
      GOTENBERG_URL: http://gotenberg:3000
      # Where contract files are linked for analysis (runbook step 6).
      INTELLIGENCE_URL: http://intelligence:8000
      # draftLegal's agent routes, now served by the intelligence tier.
      AGENTS_URL: http://intelligence:8000/agents
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?set PORTAL_JWT_SECRET in Coolify}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in Coolify}
      # The API's internal tool routes (playbook review after analysis).
      API_INTERNAL_URL: http://api:8080
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGEAI_API_KEY: ${VOYAGE_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-clm-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in Coolify}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in Coolify}
      # Email: SendGrid (HTTPS) or SMTP. With neither set nothing is delivered;
      # Admin → Organization → Email shows the outbox either way.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      # The X.509 cert executed PDFs are sealed with (PAdES). Required in
      # production: without it every seal fails and a signed contract has no
      # sealed document. Generate: pnpm --filter api signing-cert
      SIGNING_CERT_P12_BASE64: ${SIGNING_CERT_P12_BASE64:-}
      SIGNING_CERT_PASSPHRASE: ${SIGNING_CERT_PASSPHRASE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # HTML → PDF, before a document is sealed. Private to the compose network.
  gotenberg:
    <<: *restart
    image: gotenberg/gotenberg:8
    # Chromium renders caller-supplied HTML (contract export, drafts). Left at
    # the default it would fetch any URL that HTML names — including this
    # stack's own services and cloud metadata — and print the response into
    # the PDF. Deny local files (except its own /tmp input), loopback, private
    # and link-local ranges, and every service name on this network.
    command:
      - gotenberg
      - --api-port=3000
      - >-
        --chromium-deny-list=^(file:(?!//\/tmp/)|https?://(127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|0\.0\.0\.0|\[)|https?://(localhost|mongo|mongot|redis|minio|minio-init|api|jobs|intelligence|worker|web|gotenberg)([:/]|$$)).*

  intelligence:
    <<: *restart
    image: contractsense/intelligence:latest
    build: *build-intelligence
    environment:
      ENVIRONMENT: prod
      API_WORKERS: ${INTEL_WORKERS:-2}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0&directConnection=true}
      MONGODB_DB_NAME: contract_core_db
      # The platform database the identity adapter and the Space watcher read.
      # Its name comes from the URL path, so csai must stay in it.
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      # Same secret as the API: that is what makes a platform token resolve to
      # a shadow user here.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      # The intelligence tier's own signing key (its native tokens). Separate
      # from JWT_SECRET on purpose; the app refuses to start without it.
      SECRET_KEY: ${INTEL_SECRET_KEY:?set INTEL_SECRET_KEY in Coolify}
      # Guards /internal/* — the lifecycle API's service-to-service calls.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in Coolify}
      # The agent tools call back into the lifecycle API for contracts, Spaces,
      # approvals and the rest.
      API_URL: http://api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Platform orgs whose admins may use Evaluations (comma-separated org ids).
      EVALUATION_ORG_IDS: ${EVALUATION_ORG_IDS:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGEAI_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # Read by the agent routes (formerly apps/agents): extra model providers
      # and Langfuse tracing. All optional; tracing is off without the keys.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mongo-migrate:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_started

  worker:
    <<: *restart
    # Same image as `intelligence`; only the entrypoint differs.
    image: contractsense/intelligence:latest
    # Built once by its sibling service; never pulled from a registry.
    pull_policy: never
    entrypoint: ['/app/celery_entrypoint.sh']
    # The image's health check probes the API's HTTP port; the Celery worker
    # serves no HTTP, so it would always read unhealthy.
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: prod
      CELERY_MODE: worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-8}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0&directConnection=true}
      MONGODB_DB_NAME: contract_core_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      SECRET_KEY: ${INTEL_SECRET_KEY:?set INTEL_SECRET_KEY in Coolify}
      # Extraction runs here, and hands each run's obligations to the
      # lifecycle API (/api/internal/obligations/sync).
      API_URL: http://api:8080
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in Coolify}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGEAI_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
        required: false
      mongo-migrate:
        condition: service_completed_successfully
        required: false

  # MongoDB 8.3 with its search process, mongot, which serves $search and
  # $vectorSearch — contract Q&A retrieves by meaning through it. A single-node
  # replica set: Prisma needs one for transactions, change streams and mongot
  # need the oplog. The health check initiates the set on first boot and
  # creates the user mongot syncs as. Data lives in mongo8-data; mongo-data is
  # the MongoDB 7 volume of an older install, copied once by mongo-migrate.
  mongo:
    profiles: [local-mongo]
    <<: *restart
    image: mongodb/mongodb-community-server:8.3-ubuntu2204
    command:
      - mongod
      - --replSet=rs0
      - --bind_ip_all
      - --setParameter
      - searchIndexManagementHostAndPort=mongot:27028
      - --setParameter
      - mongotHost=mongot:27028
      - --setParameter
      - skipAuthenticationToSearchIndexManagementServer=false
      - --setParameter
      - useGrpcForSearch=true
      - --setParameter
      - searchTLSMode=disabled
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-}
    volumes:
      - mongo8-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }
          if (!db.hello().isWritablePrimary) quit(1);
          const admin = db.getSiblingDB("admin");
          if (!admin.getUser("mongotUser")) admin.createUser({user:"mongotUser",pwd:process.env.MONGOT_PASSWORD,roles:["searchCoordinator"]});
          print("ready")' | grep -q ready
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Builds and serves the search and vector indexes, synced from mongo over
  # its change streams. It insists its password file be owner-only, so the
  # file and the config are written at start rather than mounted.
  mongot:
    profiles: [local-mongo]
    <<: *restart
    image: mongodb/mongodb-community-search:1.70.4
    entrypoint: ['bash', '-c']
    command:
      - |
        set -eu
        [ -n "$$MONGOT_PASSWORD" ] || { echo "mongot: set MONGOT_PASSWORD (local MongoDB only)" >&2; exit 1; }
        (umask 077 && printf '%s' "$$MONGOT_PASSWORD" > /tmp/mongot-password)
        cat > /tmp/mongot.yml <<'YML'
        syncSource:
          replicaSet:
            hostAndPort: "mongo:27017"
            scramAuth:
              username: "mongotUser"
              passwordFile: "/tmp/mongot-password"
              authSource: "admin"
              tls:
                enabled: false
        storage:
          dataPath: "/data/mongot"
        server:
          grpc:
            address: "0.0.0.0:27028"
            tls:
              mode: "disabled"
        metrics:
          enabled: false
          address: "127.0.0.1:9946"
        healthCheck:
          address: "0.0.0.0:8080"
        logging:
          verbosity: INFO
        YML
        exec /mongot-community/mongot --config /tmp/mongot.yml
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD}
    volumes:
      - mongot-data:/data/mongot
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8080/health | grep -q SERVING']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy

  # One-shot. An install from before MongoDB 8.3 kept its data in mongo-data,
  # which MongoDB 8.3 cannot open. This starts that data under MongoDB 7 and
  # copies every database into mongo, once; the old volume is left as it was,
  # as a backup, until you remove it. A no-op on a new install.
  mongo-migrate:
    profiles: [local-mongo]
    image: mongo:7
    restart: 'no'
    entrypoint: ['bash', '-c']
    command:
      - |
        set -euo pipefail
        target='mongodb://mongo:27017/?replicaSet=rs0&directConnection=true'
        mark() { mongosh "$$target" --quiet --eval "db.getSiblingDB('cs_meta').migrations.updateOne({_id:'mongo7-to-8'},{\$$set:{at:new Date(),note:'$$1'}},{upsert:true})" >/dev/null; }
        seen=$$(mongosh "$$target" --quiet --eval "db.getSiblingDB('cs_meta').migrations.countDocuments({_id:'mongo7-to-8'})")
        if [ "$$seen" = "1" ]; then echo "mongo-migrate: already done"; exit 0; fi
        if [ ! -f /old/WiredTiger ]; then echo "mongo-migrate: no MongoDB 7 data, nothing to copy"; mark none; exit 0; fi
        echo "mongo-migrate: copying MongoDB 7 data into MongoDB 8.3"
        mongod --dbpath /old --port 27018 --bind_ip 127.0.0.1 --fork --logpath /tmp/mongod7.log
        mongodump --port 27018 --archive \
          | mongorestore --uri "$$target" --archive --nsExclude='admin.*' --nsExclude='config.*' --nsExclude='cs_meta.*'
        mongod --dbpath /old --shutdown
        mark copied
        echo "mongo-migrate: done; mongo-data is kept as a backup"
    volumes:
      - mongo-data:/old
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    <<: *restart
    image: redis:7-alpine
    # AOF: a restart must not lose queued jobs or the Celery backlog.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  minio:
    <<: *restart
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in Coolify}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in Coolify}
    volumes:
      - minio-data:/data

volumes:
  mongo8-data:
  mongot-data:
  # MongoDB 7 data from before 8.3; read once by mongo-migrate.
  mongo-data:
  redis-data:
  minio-data:
