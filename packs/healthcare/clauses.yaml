- key: hipaa_security_rule_safeguards
  category: security
  title: HIPAA Security Rule Safeguards
  text: <p>Provider will implement administrative, physical, and technical safeguards required by the HIPAA Security Rule (45 CFR Part 164, Subpart C), including access controls, audit controls, integrity controls, transmission security, and workforce training. Provider's safeguards are aligned with the NIST Cybersecurity Framework and SP 800-53.</p>
