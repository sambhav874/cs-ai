- key: patient_access_to_phi
  category: data-privacy
  title: Patient Access to PHI
  text: <p>Provider will, within 15 days of Customer's request, make available to Customer (for forwarding to a patient) any PHI in a designated record set held by Provider, to enable Customer to comply with its obligations under 45 CFR § 164.524.</p>
