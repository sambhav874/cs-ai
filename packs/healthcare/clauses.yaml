- key: hipaa_minimum_necessary
  category: data-privacy
  title: HIPAA — Minimum Necessary
  text: <p>Provider will request, use, and disclose only the minimum amount of PHI reasonably necessary to perform the Services, in accordance with the Minimum Necessary standard under HIPAA.</p>
