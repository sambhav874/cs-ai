  category: data-privacy
  title: HIPAA Breach Notification — 60 Days
  text: <p>Provider will notify Customer of any actual or reasonably suspected Breach of Unsecured PHI without unreasonable delay and in no event later than 60 calendar days after discovery, with the information required by 45 CFR § 164.410.</p>
