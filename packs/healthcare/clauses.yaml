- key: de_identification
  category: data-privacy
  title: De-Identification
  text: <p>Provider may use PHI to create de-identified data (under the Safe Harbor or Expert Determination methods of 45 CFR § 164.514(b)) and to use such de-identified data for purposes of improving the Services and producing aggregate analytics. De-identified data is not PHI and is not subject to HIPAA restrictions.</p>
