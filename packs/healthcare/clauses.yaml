- key: hipaa_business_associate_status
  category: data-privacy
  title: HIPAA — Business Associate Status
  text: <p>The parties acknowledge that, to the extent Provider creates, receives, maintains, or transmits Protected Health Information ("PHI") on behalf of Customer in connection with the Services, Provider is a "Business Associate" and Customer is a "Covered Entity" or "Business Associate" (as applicable) under the HIPAA Privacy Rule and Security Rule. The Business Associate Agreement attached as Exhibit {{baaExhibit}} governs the handling of PHI.</p>
