- key: anti_kickback_statute_and_stark_law_compliance
  category: compliance
  title: Anti-Kickback Statute and Stark Law Compliance
  text: <p>The parties agree that the fees and other terms of this Agreement have been negotiated at arm's length, represent fair market value for the Services, and are not intended to induce or reward referrals of patients or business in violation of the federal Anti-Kickback Statute (42 USC § 1320a-7b(b)) or the Stark Law (42 USC § 1395nn).</p>
