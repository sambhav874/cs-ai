- key: inspection_and_acceptance_of_goods
  category: scope-services
  title: Inspection and Acceptance of Goods
  text: <p>Buyer may inspect Goods within 30 days of delivery. Buyer may reject Goods that fail to conform to the specifications in the applicable purchase order by giving written notice describing the non-conformity. Seller will, at Buyer's option, repair, replace, or refund the price of non-conforming Goods. Goods not rejected within 30 days are deemed accepted.</p>
  tags:
    - manufacturing
    - inspection
    - acceptance
  risk_rating: standard
  review:
    status: sample
    reviewer: null
    reviewed_on: null
    jurisdiction: US
- key: product_warranty_12_months
  category: warranties
  title: Product Warranty — 12 Months
  text: <p>Seller warrants that the Goods will be free from defects in material and workmanship and will conform to the specifications for a period of twelve (12) months from delivery. Seller's sole obligation under this warranty is to, at its option, repair, replace, or refund the purchase price of non-conforming Goods.</p>
  tags:
