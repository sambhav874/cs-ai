- key: supply_chain_force_majeure
  category: force-majeure
  title: Supply-Chain Force Majeure
  text: <p>Force Majeure includes, in addition to other events, the unavailability of components or raw materials from Seller's supply chain due to events beyond Seller's reasonable control, including export controls, tariffs, port closures, and shortages affecting the industry generally. Seller will use commercially reasonable efforts to source alternate supplies and to notify Buyer of allocation impacts.</p>
