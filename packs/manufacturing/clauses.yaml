- key: price_adjustment_raw_materials
  category: fees-payment
  title: Price Adjustment — Raw Materials
  text: <p>Seller may adjust prices on 60 days' written notice in response to material changes (greater than 10%) in the cost of key raw materials, supported by reasonable documentation. Buyer may, in lieu of accepting the price adjustment, terminate the affected orders without penalty.</p>
