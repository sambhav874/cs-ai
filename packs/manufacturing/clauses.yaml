- key: oem_custom_tooling_ownership
  category: ip-ownership
  title: OEM / Custom Tooling Ownership
  text: <p>If Buyer pays for custom tooling, molds, or fixtures, Buyer owns the tooling. Seller will maintain the tooling, use it solely to produce Goods for Buyer, and return or destroy it at Buyer's direction on termination of the supply relationship.</p>
