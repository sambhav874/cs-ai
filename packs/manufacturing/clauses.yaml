  category: compliance
  title: Country of Origin and Tariff Compliance
  text: <p>Seller will, on each shipment, accurately declare the country of origin of the Goods and provide all documentation required for Buyer to claim applicable preferential tariff treatment (including USMCA certifications). Seller is responsible for the accuracy of country-of-origin declarations.</p>
