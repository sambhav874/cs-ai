- key: recall_cooperation
  category: warranties
  title: Recall Cooperation
  text: <p>If either party becomes aware of any defect or safety issue that may necessitate a recall, withdrawal, or corrective action with respect to any Goods, that party will notify the other party promptly. The parties will cooperate in good faith to investigate and, if necessary, implement a recall. Seller will bear the cost of any recall attributable to defects in the Goods.</p>
