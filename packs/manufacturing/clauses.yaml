  category: scope-services
  title: Delivery Terms — FCA (Incoterms 2020)
  text: <p>Unless otherwise specified in a purchase order, all deliveries are FCA Seller's facility (Incoterms 2020). Title and risk of loss pass to Buyer upon delivery to Buyer's nominated carrier at Seller's facility.</p>
