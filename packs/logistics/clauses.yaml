- key: dot_fmcsa_compliance
  category: compliance
  title: DOT / FMCSA Compliance
  text: <p>Carrier represents that it (a) is registered with the Federal Motor Carrier Safety Administration with active operating authority; (b) maintains a satisfactory safety rating (or no rating if newly registered); (c) complies with Hours-of-Service regulations (49 CFR Part 395); and (d) maintains valid Electronic Logging Devices on all commercial motor vehicles as required by 49 CFR Part 395.</p>
