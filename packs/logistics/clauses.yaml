- key: carrier_cargo_liability_carmack_released_value
  category: liability
  title: Carrier Cargo Liability — Carmack / Released Value
  text: <p>For shipments subject to the Carmack Amendment (49 USC § 14706), Carrier's liability for loss or damage to Cargo is the actual value of the Cargo at the point of origin, subject to a maximum of $5.00 per pound per package unless Shipper declares a higher released value in writing and pays the applicable surcharge. International shipments are subject to the Montreal or Warsaw Convention or Hague-Visby Rules, as applicable.</p>
  tags:
    - logistics
    - carrier-liability
    - carmack
  risk_rating: standard
