  title: Hazardous Materials
  text: <p>Carrier will not transport hazardous materials, hazardous substances, or hazardous wastes (as those terms are defined under 49 CFR Parts 171–180) unless (a) Shipper provides accurate shipping papers and labeling and (b) Carrier holds the necessary hazmat endorsement and permits.</p>
