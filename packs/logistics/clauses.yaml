- key: subcontracting_brokering
  category: scope-services
  title: Subcontracting / Brokering
  text: <p>Carrier may not subcontract or broker any Shipment without Shipper's prior written consent. If Shipper consents, Carrier remains primarily liable to Shipper for the performance of any subcontracted carrier and ensures all subcontractors meet the insurance and compliance requirements of this Agreement.</p>
