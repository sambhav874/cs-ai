- key: auto_liability_and_cargo_insurance
  category: insurance
  title: Auto Liability and Cargo Insurance
  text: <p>Carrier will maintain (a) Commercial Auto Liability insurance of not less than $1,000,000 combined single limit; (b) Motor Truck Cargo insurance of not less than $250,000 per shipment with no exclusions for shipper's commodity; and (c) General Liability of not less than $1,000,000. Carrier will name Shipper as additional insured on the Auto Liability policy.</p>
  tags:
    - logistics
    - insurance
    - cargo
  risk_rating: favorable
