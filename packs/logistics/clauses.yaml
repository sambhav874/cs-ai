    status: sample
    reviewer: null
    reviewed_on: null
    jurisdiction: US
- key: fuel_surcharge
  category: fees-payment
  title: Fuel Surcharge
  text: <p>Rates are subject to a fuel surcharge, calculated weekly based on the U.S. Department of Energy's national average diesel price published each Monday. The fuel surcharge applies as set forth in Exhibit A and may be adjusted up or down as fuel prices change.</p>
