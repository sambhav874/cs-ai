- key: delivery_service_levels
  category: scope-services
  title: Delivery Service Levels
  text: <p>Carrier will achieve on-time pickup and on-time delivery performance of at least 95% measured monthly. "On-time" means within the 2-hour delivery window confirmed at booking. Shipments delayed by more than 24 hours from the scheduled delivery time are subject to a 25% rate refund.</p>
