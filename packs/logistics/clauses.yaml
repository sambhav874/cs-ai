- key: demurrage_and_detention
  category: fees-payment
  title: Demurrage and Detention
  text: <p>Free time for loading and unloading is two (2) hours per stop. Detention beyond free time is charged at $75 per hour or fraction thereof. Demurrage charges apply to containers held at port or rail beyond the carrier's free time at the applicable per diem rate.</p>
