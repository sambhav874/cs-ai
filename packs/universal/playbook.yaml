- key: pb-defs-precedence-preferred
  category: definitions
  position: preferred
  text: "<p>Order of precedence: (a) amendment, (b) main agreement, (c) SOW/Order Form, (d) exhibits. No purchase-order or pre-printed terms apply.</p>"
  notes: Always push for explicit order-of-precedence; vendor "battle of the forms" attempts are common.
  risk_threshold: 0.7
  contract_types: []
  sort_order: 10
- key: pb-defs-precedence-fallback
  category: definitions
  position: fallback
  text: "<p>Order of precedence: amendment > main agreement > SOW. Pre-printed PO terms expressly disclaimed.</p>"
  notes: Acceptable if exhibits are minor.
  risk_threshold: 0.5
  contract_types: []
  sort_order: 20
- key: pb-defs-precedence-walkaway
  category: definitions
  position: walkaway
  text: <p>Vendor's pre-printed terms control over negotiated agreement, OR PO terms govern.</p>
  notes: Walk away — this nullifies the negotiation.
  risk_threshold: 0.2
  contract_types: []
  sort_order: 30
