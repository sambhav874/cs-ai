- key: glp_gmp_compliance
  category: compliance
  title: GLP / GMP Compliance
  text: <p>Provider will perform any preclinical safety studies in accordance with Good Laboratory Practice (GLP, 21 CFR Part 58) and any manufacturing of clinical or commercial supplies in accordance with current Good Manufacturing Practice (cGMP, 21 CFR Parts 210–211 and 600–680, as applicable). Provider will maintain all records and documentation required to support FDA submissions.</p>
