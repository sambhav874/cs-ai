name: Material Transfer Agreement (Research)
description: Standard MTA for transferring biological materials between research entities for non-commercial research use.
contract_type: MTA
published: true
variables:
  - key: providerName
    label: Provider Institution
    type: string
    required: true
  - key: recipientName
    label: Recipient Institution
    type: string
    required: true
  - key: effectiveDate
    label: Effective Date
    type: date
    required: true
  - key: materialDescription
    label: Material Description
    type: string
    required: true
  - key: researchPurpose
    label: Research Purpose
    type: string
    required: true
sections:
  - title: Provider and Recipient
    sort_order: 10
    text: <p>This Material Transfer Agreement is entered into as of {{effectiveDate}} between {{providerName}} ("Provider") and {{recipientName}} ("Recipient").</p>
  - title: Material
    sort_order: 20
    text: <p>Provider will transfer to Recipient {{materialDescription}} (the "Original Material"), together with any progeny and unmodified derivatives (collectively, the "Material").</p>
  - title: Use of the Material
    sort_order: 30
    text: <p>Recipient will use the Material solely for {{researchPurpose}} and for no other purpose. Recipient will not use the Material in human subjects, in diagnostic procedures, or for commercial purposes. Recipient will not transfer the Material to any third party without Provider's prior written consent.</p>
  - title: Ownership
    sort_order: 40
    text: <p>Provider retains all rights in the Material, including all progeny and unmodified derivatives. Modifications and inventions made by Recipient using the Material are owned by Recipient, subject to Provider's rights in the underlying Material.</p>
  - title: Publications
    sort_order: 50
    text: <p>Recipient may publish research results based on the Material. Recipient will provide Provider with a copy of any proposed publication at least 30 days before submission. Recipient will acknowledge Provider in any publication.</p>
  - title: No Warranty
    sort_order: 60
    text: <p>The Material is provided "AS IS" without any warranty of any kind. Provider makes no representation that the Material is safe, effective, or suitable for any particular purpose, or that its use will not infringe any third-party rights.</p>
  - title: Indemnification
    sort_order: 70
    text: <p>Recipient will indemnify Provider against any claim arising from Recipient's use, storage, or handling of the Material, except to the extent caused by Provider's gross negligence or willful misconduct.</p>
  - title: Term and Termination
    sort_order: 80
    text: <p>This Agreement continues until the research purpose is complete or terminated by either party on 30 days' notice. On termination, Recipient will return or destroy any remaining Material at Provider's direction.</p>
