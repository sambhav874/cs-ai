- key: multi_region_high_availability
  category: service-levels
  title: Multi-Region High Availability
  text: <p>Provider operates the Services across at least two geographically-separated regions in an active-active configuration designed to maintain availability in the event of a regional outage. Customer Data is replicated synchronously within a region and asynchronously across regions.</p>
