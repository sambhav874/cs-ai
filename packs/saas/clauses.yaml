    jurisdiction: US
- key: customer_managed_encryption_keys_cmek
  category: data-privacy
  title: Customer-Managed Encryption Keys (CMEK)
  text: <p>If Customer elects to use Customer-managed encryption keys for Customer Data at rest, Provider will support standard integrations with major key management services (AWS KMS, Google Cloud KMS, Azure Key Vault). Customer is responsible for key lifecycle management and any availability impact resulting from key access issues.</p>
