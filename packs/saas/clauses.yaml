- key: true_up_overage_billing
  category: fees-payment
  title: True-Up / Overage Billing
  text: <p>If Customer's actual usage exceeds the licensed limits (e.g., authorized users, API calls, or storage), Customer will pay overage fees at the then-current published rates, billed monthly in arrears. Provider will provide Customer with usage reports and a 30-day window to reduce usage before overage charges apply.</p>
