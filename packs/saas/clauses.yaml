- key: disaster_recovery_rpo_rto_commitment
  category: service-levels
  title: Disaster Recovery — RPO/RTO Commitment
  text: <p>Provider will maintain a Recovery Point Objective (RPO) of no more than 1 hour and a Recovery Time Objective (RTO) of no more than 4 hours. Provider will test its DR procedures at least annually and provide a summary of test results to Customer upon request.</p>
  tags:
    - saas
