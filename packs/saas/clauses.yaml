- key: scheduled_maintenance_window
  category: service-levels
  title: Scheduled Maintenance Window
  text: <p>Provider will perform Scheduled Maintenance during a designated maintenance window of no more than 4 hours per month, scheduled outside of Customer's primary business hours where reasonably practicable. Scheduled Maintenance does not count against the uptime commitment provided that Provider gives at least 72 hours' advance notice.</p>
  tags:
    - saas
    - maintenance
  risk_rating: standard
