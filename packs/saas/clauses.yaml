    jurisdiction: US
- key: customer_data_export
  category: ip-ownership
  title: Customer Data Export
  text: <p>At any time during the Term and for up to 90 days after termination, Customer may export its Customer Data in a structured, commonly-used, machine-readable format (such as JSON or CSV) at no additional cost. Provider will provide reasonable assistance with the export process.</p>
