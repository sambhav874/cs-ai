- key: tenant_isolation
  category: security
  title: Tenant Isolation
  text: <p>Provider will maintain logical isolation between tenant environments such that no tenant can access another tenant's Customer Data, including in shared infrastructure. Provider's tenant-isolation controls are validated annually as part of Provider's SOC 2 Type II audit.</p>
  tags:
    - saas
    - security
    - multi-tenant
  risk_rating: favorable
